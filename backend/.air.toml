# .air.toml - Air configuration for Go hot-reload in development
# Provides live reloading during local development

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Command to build the application
  cmd = "go build -o ./tmp/main ."
  # Binary file path
  bin = "tmp/main"
  # Include these file extensions
  include_ext = ["go", "tpl", "tmpl", "html"]
  # Ignore these file extensions
  exclude_ext = ["_test.go"]
  # Watch these directories
  include_dir = []
  # Ignore these directories
  exclude_dir = ["tmp", "vendor", "testdata", "tests"]
  # Watch these files
  include_file = []
  # Ignore these files
  exclude_file = []
  # Exclude specific regular expressions
  exclude_regex = ["_test\\.go"]
  # Follow symlinks
  follow_symlink = false
  # Build delay in seconds
  delay = 0
  # Stop old binary when new binary is built
  stop_on_root = false
  # Send interrupt signal before killing
  send_interrupt = false
  # Delay before sending interrupt
  kill_delay = "0s"

[log]
  # Show log time
  time = true
  # Only show main log (silence watcher, build)
  main_only = false

[color]
  # Customize each part's color
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Delete tmp directory on exit
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
