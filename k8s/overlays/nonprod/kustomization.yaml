apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: cicd-training-nonprod

namespace: nonprod

commonLabels:
  environment: nonprod
  app.kubernetes.io/instance: nonprod

resources:
  - ../../base
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml

# Environment-specific patches
patches:
  - path: patches/backend-deployment.yaml
  - path: patches/frontend-deployment.yaml

# Images are updated by CI/CD pipeline
images:
  - name: backend
    newName: ghcr.io/nuttapong14/go-github-actions/backend
    newTag: latest
  - name: frontend
    newName: ghcr.io/nuttapong14/go-github-actions/frontend
    newTag: latest
