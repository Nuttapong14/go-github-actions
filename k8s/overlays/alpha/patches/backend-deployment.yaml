apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # Alpha environment runs fewer replicas
  replicas: 1
  template:
    metadata:
      labels:
        environment: alpha
    spec:
      containers:
        - name: backend
          env:
            - name: ENVIRONMENT
              value: "alpha"
            - name: LOG_LEVEL
              value: "debug"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
