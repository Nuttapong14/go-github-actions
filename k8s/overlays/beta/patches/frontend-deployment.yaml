apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  template:
    metadata:
      labels:
        environment: beta
    spec:
      containers:
        - name: frontend
          env:
            - name: NEXT_PUBLIC_ENVIRONMENT
              value: "beta"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
