# Reusable Build Workflow
# Builds production artifacts for both backend (Go binary) and frontend (Next.js)
# Called by main CI workflow
#
# Usage:
#   jobs:
#     build:
#       uses: ./.github/workflows/reusable-build.yml
#       with:
#         go-version: '1.23'
#         node-version: '22'

name: Build

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use'
        required: false
        type: string
        default: '1.23'
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '22'
      build-docker:
        description: 'Whether to build Docker images'
        required: false
        type: boolean
        default: false
      push-images:
        description: 'Whether to push Docker images to registry'
        required: false
        type: boolean
        default: false
    outputs:
      backend-artifact:
        description: 'Backend build artifact name'
        value: ${{ jobs.backend-build.outputs.artifact-name }}
      frontend-artifact:
        description: 'Frontend build artifact name'
        value: ${{ jobs.frontend-build.outputs.artifact-name }}
      image-tag:
        description: 'Docker image tag used'
        value: ${{ jobs.docker-build.outputs.image-tag }}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-training-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-training-frontend

jobs:
  backend-build:
    name: Build Backend (Go)
    runs-on: ubuntu-latest
    outputs:
      artifact-name: backend-binary-${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: cd backend && go mod download

      - name: Get build info
        id: build-info
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          IMAGE_TAG="${GIT_TAG:-$GIT_SHA}"

          echo "git-sha=$GIT_SHA" >> $GITHUB_OUTPUT
          echo "git-tag=$GIT_TAG" >> $GITHUB_OUTPUT
          echo "build-date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

          echo "Build Info:"
          echo "  Git SHA: $GIT_SHA"
          echo "  Git Tag: $GIT_TAG"
          echo "  Build Date: $BUILD_DATE"
          echo "  Image Tag: $IMAGE_TAG"

      - name: Build backend binary
        run: |
          cd backend
          mkdir -p ../bin

          go build \
            -ldflags "-X main.Version=${{ steps.build-info.outputs.image-tag }} \
                      -X main.GitSHA=${{ steps.build-info.outputs.git-sha }} \
                      -X main.BuildDate=${{ steps.build-info.outputs.build-date }}" \
            -o ../bin/backend \
            main.go

          echo "Backend binary built successfully"
          ls -la ../bin/backend

      - name: Verify binary
        run: |
          file bin/backend
          chmod +x bin/backend
          # Test that binary runs (will fail fast due to missing DB, but proves it starts)
          timeout 2 ./bin/backend --help 2>/dev/null || true

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary-${{ github.sha }}
          path: bin/backend
          retention-days: 7

  frontend-build:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest
    outputs:
      artifact-name: frontend-build-${{ github.sha }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build
        env:
          NODE_ENV: production

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/.next/
          retention-days: 7

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: ${{ inputs.build-docker }}
    needs: [backend-build, frontend-build]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get image tag
        id: meta
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
          IMAGE_TAG="${GIT_TAG:-$GIT_SHA}"
          echo "tags=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $IMAGE_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: ${{ inputs.push-images }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: ${{ inputs.push-images }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tags }}
            ${{ env.BACKEND_IMAGE }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: ${{ inputs.push-images }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tags }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
