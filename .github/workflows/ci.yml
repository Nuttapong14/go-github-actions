# Main CI Workflow
# Orchestrates the complete CI pipeline: lint → test → build → scan
# Triggers on push to main/develop and pull requests
#
# This workflow demonstrates:
# - Reusable workflows for modular CI/CD
# - Parallel job execution where possible
# - SonarCloud integration for code quality
# - Artifact management for build outputs
# - Branch-specific behaviors

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions required for reusable workflows
permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '22'
  COVERAGE_THRESHOLD: 80

jobs:
  # =============================================================================
  # Stage 1: Lint - Run linting checks
  # =============================================================================
  lint:
    name: Lint
    uses: ./.github/workflows/reusable-lint.yml
    with:
      go-version: '1.23'
      node-version: '22'

  # =============================================================================
  # Stage 2: Test - Run tests with coverage
  # =============================================================================
  test:
    name: Test
    needs: lint
    uses: ./.github/workflows/reusable-test.yml
    with:
      go-version: '1.23'
      node-version: '22'
      coverage-threshold: 80

  # =============================================================================
  # Stage 3: Build - Build production artifacts
  # =============================================================================
  build:
    name: Build
    needs: test
    uses: ./.github/workflows/reusable-build.yml
    with:
      go-version: '1.23'
      node-version: '22'
      # Build Docker images on main/develop branches
      build-docker: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      push-images: false  # Don't push images during CI, only during CD

  # =============================================================================
  # Stage 4: SonarCloud Analysis - Code quality and security scanning
  # =============================================================================
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test
    # Only run if SONAR_TOKEN is configured and not a fork
    if: ${{ !github.event.pull_request.head.repo.fork && vars.SONAR_ENABLED == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate blame information

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/

      - name: Download backend test report
        uses: actions/download-artifact@v4
        with:
          name: backend-test-report
          path: backend/
        continue-on-error: true

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_go-github-actions
            -Dsonar.organization=${{ github.repository_owner }}

  # =============================================================================
  # Summary Job - Aggregates results and provides status
  # =============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build, sonarcloud]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "=============================================="
          echo "CI Pipeline Summary"
          echo "=============================================="
          echo ""
          echo "Git SHA:    ${{ github.sha }}"
          echo "Branch:     ${{ github.ref_name }}"
          echo "Event:      ${{ github.event_name }}"
          echo ""
          echo "Job Results:"
          echo "  Lint:       ${{ needs.lint.result }}"
          echo "  Test:       ${{ needs.test.result }}"
          echo "  Build:      ${{ needs.build.result }}"
          echo "  SonarCloud: ${{ needs.sonarcloud.result }}"
          echo ""

          # Determine overall status
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "=============================================="
            echo "❌ CI Pipeline FAILED"
            echo "=============================================="
            exit 1
          else
            echo "=============================================="
            echo "✅ CI Pipeline PASSED"
            echo "=============================================="
          fi

      - name: Create status check
        if: github.event_name == 'pull_request'
        run: |
          echo "Coverage Report:"
          echo "  Backend:  ${{ needs.test.outputs.backend-coverage }}%"
          echo "  Frontend: ${{ needs.test.outputs.frontend-coverage }}%"
          echo ""
          echo "Build Artifacts:"
          echo "  Backend:  ${{ needs.build.outputs.backend-artifact }}"
          echo "  Frontend: ${{ needs.build.outputs.frontend-artifact }}"
