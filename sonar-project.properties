# SonarCloud configuration for CI/CD Training Application
# This configuration enables code quality analysis for Go backend and Next.js frontend

sonar.projectKey=go-github-actions
sonar.organization=devops-training

# Source code locations
sonar.sources=backend,frontend
sonar.tests=backend/tests,frontend/tests

# Exclusions
sonar.exclusions=\
  **/*_test.go,\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/dist/**,\
  **/build/**,\
  **/*.min.js,\
  **/migrations/**,\
  **/vendor/**

# Test exclusions
sonar.test.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/dist/**,\
  **/build/**,\
  **/*.min.js,\
  **/migrations/**,\
  **/vendor/**

# Go-specific configuration
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.go.tests.reportPaths=backend/test-report.json

# JavaScript/TypeScript configuration
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# Code coverage exclusions
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/models/*.go,\
  **/config/*.go,\
  **/main.go,\
  **/node_modules/**,\
  **/.next/**,\
  **/frontend/app/layout.tsx

# Duplication detection
sonar.cpd.go.minimumTokens=50
sonar.cpd.javascript.minimumTokens=50

# Quality Gate settings (adjust based on project requirements)
# 0 critical/blocker issues allowed per constitution
sonar.qualitygate.wait=true

# Encoding
sonar.sourceEncoding=UTF-8

# Language-specific properties
sonar.go.enableReport=false

# Exclude specific rules if needed
# sonar.issue.ignore.multicriteria=e1,e2
# sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S4328
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.tsx
